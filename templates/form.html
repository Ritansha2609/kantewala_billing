<!DOCTYPE html>
<html>
<head>
    <title>Customer & Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f2f2f2;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 600px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
        }
        label {
            display: inline-block;
            width: 150px;
        }
        input {
            margin-bottom: 10px;
            padding: 6px;
            width: 70%;
        }
        .product {
            margin-top: 15px;
        }
        button, input[type="submit"] {
            padding: 10px 20px;
            margin-top: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        .add-btn {
            background: #007bff;
        }
    </style>
</head>
<body>
    <form action="/confirm_gst" method="POST">
        <h2>Enter Customer & Product Details</h2>
        <label>Customer Name:</label><input name="customer_name" required><br>
        <label>Address:</label><input name="customer_address"><br>
        <label>State:</label><input value = "Maharashtra" name="customer_state"><br>
        <label>Phone:</label><input name="customer_phone"><br>

        <h3>Product(s)</h3>
        <div id="product-container">
            <div class="product">
                Name: <input name="product_name[]" required>
                <br></br>
                Qty: <input name="product_qty[]" type="number" required>
                <br></br>
                Total Amount: <input name="product_amount[]" type="number" step="0.01" required>
            </div>
        </div>
        <button type="button" class="add-btn" onclick="addProduct()">+ Add More</button><br>
        <input type="submit" value="Next →">
    </form>

    <script>
        function addProduct() {
            let div = document.createElement('div');
            div.className = 'product';
            div.innerHTML = '------------------------<br></br>Name: <input name="product_name[]" required><br></br> Qty: <input name="product_qty[]" type="number" required> <br></br>Amount: <input name="product_amount[]" type="number" step="0.01" required>';
            document.getElementById('product-container').appendChild(div);
        }
    </script>
</body>
</html>
